[project]
name = "ayurip-sahayak"
version = "2.0.0"
description = "RAG assistant for Ayurveda, Traditional Knowledge and IPR with cited answers"
requires-python = ">=3.12"

# Runtime dependencies. Vercel installs these; keep requirements.txt identical
# (backend/tests/test_dependencies.py checks that they match).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "google-genai==2.20.0",
    "numpy==2.5.2",
    "python-dotenv==1.2.3",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
