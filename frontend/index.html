<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>AyurIP Sahayak — Ayurveda &amp; IP research assistant</title>
    <meta
      name="description"
      content="Ask questions about Ayurveda, Traditional Knowledge, TKDL and Intellectual Property Rights. Answers are grounded in a curated knowledge base and cite the exact page."
    />
    <meta name="theme-color" content="#f6f3ea" />

    <script>
      // Apply a saved theme before first paint to avoid a light/dark flash
      try {
        var savedTheme = localStorage.getItem("ayurip-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {}
    </script>

    <meta property="og:title" content="AyurIP Sahayak — Ayurveda & IP research assistant" />
    <meta
      property="og:description"
      content="A RAG assistant that answers questions on Ayurveda, Traditional Knowledge and IPR with page-level citations, in English and Hindi."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
